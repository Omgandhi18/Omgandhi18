name: Contribution snake

on:
  schedule:
    - cron: "37 20 * * *"   # daily at 02:07 IST, after the GitLab activity sync
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF2E8A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF2E8A

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
