name: Activity widget

on:
  schedule:
    - cron: "37 20 * * *"   # daily at 02:07 IST, after the GitLab activity sync
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/snake.yml
      - assets/src/frame_activity.py

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Draw the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg

      # dist/ is created by the snk container as root, so write the widget somewhere else
      - name: Frame it as an iOS Activity widget
        run: python3 assets/src/frame_activity.py dist/snake.svg out

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
          commit_message: Update Activity widget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
