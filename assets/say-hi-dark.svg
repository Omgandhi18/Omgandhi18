<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 76" width="420" height="76" role="img" aria-label="Slide to say hi: email Om">
<title>Say hi</title>
<defs>
<linearGradient id="knob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5FA8"/><stop offset="1" stop-color="#FF2E8A"/></linearGradient>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="0">
<stop offset="0" stop-color="#8B949E"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8B949E"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-60 0; 380 0" dur="2.6s" repeatCount="indefinite"/>
