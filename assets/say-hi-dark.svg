<text x="243.0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="500" fill="url(#shine)" text-anchor="middle">slide to say hi</text>
